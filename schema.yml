  /student/{student_id}/subjects/:
    get:
      operationId: student_subjects_retrieve
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - student
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSubjectsResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
components:
  schemas:
    AddCategoryRequest:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    AddStudentRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
      required:
      - password
      - username
    AddSubjectInterestRequest:
      type: object
      properties:
        student_id:
          type: integer
        subject_id:
          type: integer
        interest:
          type: integer
          maximum: 5
          minimum: 1
      required:
      - interest
      - student_id
      - subject_id
    AddSubjectRequest:
      type: object
      properties:
        name:
          type: string
        category_id:
          type: integer
          nullable: true
      required:
      - name
    ImportSubjectsRequest:
      type: object
      properties:
        study_subjects:
          type: array
          items:
            type: string
        model:
          type: string
    ScrapeTextRequest:
      type: object
      properties:
        url:
          type: string
        fromSemester:
          type: integer
        toSemester:
          type: integer
      required:
      - url
    StudentSubjectsResponse:
      type: object
      properties:
        student_id:
          type: integer
        student_username:
          type: string
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectItem'
        total_subjects:
          type: integer
      required:
      - student_id
      - student_username
      - subjects
      - total_subjects
    SubjectItem:
      type: object
      properties:
        subject_id:
          type: integer
        name:
          type: string
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
          nullable: true
        interest:
          type: integer
        interest_description:
          type: string
          nullable: true
      required:
      - category_id
      - category_name
      - interest
      - interest_description
      - name
      - subject_id
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
