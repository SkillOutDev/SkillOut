name: SD-59 Subject Interest E2E

on:
  push:
    branches:
      - SD-59-as-kaip-studentas-noriu-pasirinkti-studiju-dalyk
      - develop
      - main
  pull_request:
    branches:
      - SD-59-as-kaip-studentas-noriu-pasirinkti-studiju-dalyk
      - develop
      - main
  workflow_dispatch:

jobs:
  cypress-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Cypress (SD-59 Subject Interest)
        run: npm run cy:run:gherkin
