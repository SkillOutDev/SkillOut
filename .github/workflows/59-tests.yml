name: Cypress SD-59 Tests

on:
  push:
    branches:
      - SD-59-as-kaip-studentas-noriu-pasirinkti-studiju-dalyk
      - copilot/sd-59-fix-cypress-timeout-tests
  pull_request:
    branches:
      - SD-59-as-kaip-studentas-noriu-pasirinkti-studiju-dalyk
      - copilot/sd-59-fix-cypress-timeout-tests

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start static fixture server
        run: |
          python3 -m http.server 8888 --directory . > /tmp/http-server.log 2>&1 &
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:8888/cypress/fixtures/subject-interest-page.html'
          wait-on-timeout: 120
          spec: cypress/e2e/sd-59-subject-interest-levels.cy.js
          browser: chrome

      - name: Archive Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-sd-59-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
