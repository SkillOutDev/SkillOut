name: Backend CI

on:
  push:
    branches:
      - main
      - "SD-[0-9]*-*"
      - develop
    paths:
      - requirements.txt
      - schema.yml
      - hello/**
      - web_project/**
  pull_request:
    branches:
      - main
      - develop
    paths:
      - requirements.txt
      - schema.yml
      - hello/**
      - web_project/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Build backend
        run: make build

      - name: Run tests
        run: make test

      - name: SonarCloud Scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=skilloutdev
            -Dsonar.projectKey=SkillOutDev_SkillOut

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillout-dist
          path: skillout-dist.zip
          if-no-files-found: error
