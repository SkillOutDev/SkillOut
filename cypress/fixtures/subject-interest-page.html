<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subject Interest Levels - SD-59</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f3f8ff 0%, #e3f2eb 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      margin: 0;
    }
    .card {
      width: min(800px, 100%);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 2rem;
    }
    .subjects-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
      text-align: left;
    }
    .subject-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #1976d2;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }
    .subject-content {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
    }
    .stars {
      display: inline-flex;
      gap: 0.2rem;
    }
    .star-button {
      border: none;
      background: transparent;
      color: #c8ccd3;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .star-button.active {
      color: #f5b301;
    }
    .number {
      font-weight: bold;
      color: #1976d2;
      margin-right: 5px;
    }
    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-delete:hover {
      background: #ffebee;
    }
    .add-subject-container {
      display: flex;
      gap: 0.5rem;
      margin: 1.5rem 0;
      padding: 1rem;
      background: #f1f5f9;
      border-radius: 10px;
    }
    .input-add {
      flex: 1;
      padding: 0.65rem 0.75rem;
      border: 1px solid #bfcad8;
      border-radius: 8px;
      font-size: 1rem;
    }
    .btn-add {
      padding: 0.65rem 1.2rem;
      background: #1b5e20;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-add:hover {
      background: #144316;
    }
    .button-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .btn-events {
      padding: 0.65rem 1.5rem;
      border: none;
      background: #1976d2;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-back {
      padding: 0.65rem 1.5rem;
      border: 1px solid #1976d2;
      background: transparent;
      color: #1976d2;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .empty-warning {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 1rem;
      background: #fff3cd;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .warning-text strong {
      font-size: 1rem;
    }
    .error-message {
      color: #d32f2f;
      font-weight: 600;
    }
    .success-message {
      color: #1b5e20;
      font-weight: 600;
      margin-top: 0.75rem;
    }
    #loading-msg {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h1>Detected Study Subjects</h1>
    <p id="loading-msg">Loading subjects...</p>
    <div id="content" style="display: none;">
      <ul class="subjects-list" id="subjects-list"></ul>
      <div class="empty-warning" id="empty-warning" style="display: none;">
        <div class="warning-icon">⚠️</div>
        <div class="warning-text">
          <strong>Sąrašas tuščias!</strong>
          <p>Be studijų dalykų renginių paieška negalima. Prašome pridėti bent vieną dalyką žemiau arba pradėti scrapinimą iš naujo.</p>
        </div>
      </div>
      <div class="add-subject-container">
        <input
          id="new-subject-input"
          class="input-add"
          type="text"
          placeholder="Enter new subject name..."
        />
        <button class="btn-add" id="btn-add">Add Subject</button>
      </div>
      <div class="button-group">
        <button class="btn-events" id="btn-events">View Events</button>
        <button class="btn-back" id="btn-back">Go Back</button>
      </div>
      <p id="save-notice"></p>
    </div>
  </div>

  <script>
    // State
    var subjects = [];
    var ratings = [];
    var subjectIds = [];

    // Configurable mock data for testing (can be overridden by Cypress)
    window._mockSubjects = ['Mathematics', 'Physics', 'Computer Science'];
    window._mockSaveError = false;

    function renderSubjects() {
      var list = document.getElementById('subjects-list');
      var empty = document.getElementById('empty-warning');
      list.innerHTML = '';

      if (subjects.length === 0) {
        empty.style.display = 'flex';
      } else {
        empty.style.display = 'none';
        subjects.forEach(function (subject, index) {
          var li = document.createElement('li');
          li.className = 'subject-item';

          var rating = ratings[index] || 0;
          var starsHtml = [1, 2, 3, 4, 5].map(function (star) {
            var isActive = star <= rating ? ' active' : '';
            return (
              '<button type="button" class="star-button' + isActive + '" ' +
              'aria-label="Rate ' + subject + ': ' + star + ' star' + (star > 1 ? 's' : '') + '" ' +
              'data-index="' + index + '" data-star="' + star + '">★</button>'
            );
          }).join('');

          li.innerHTML =
            '<div class="subject-content">' +
              '<div><span class="number">' + (index + 1) + '.</span> ' + subject + '</div>' +
              '<div class="stars" aria-label="Subject rating">' + starsHtml + '</div>' +
            '</div>' +
            '<button class="btn-delete" data-index="' + index + '" ' +
            'aria-label="Delete ' + subject + '">🗑️</button>';

          list.appendChild(li);
        });
      }
    }

    function setRating(index, stars) {
      var previous = ratings[index] || 0;
      ratings[index] = stars;
      renderSubjects();

      if (window._mockSaveError) {
        var notice = document.getElementById('save-notice');
        notice.textContent = 'Failed to save rating.';
        notice.className = 'error-message';
        ratings[index] = previous;
        renderSubjects();
      }
    }

    function removeSubject(index) {
      subjects.splice(index, 1);
      ratings.splice(index, 1);
      subjectIds.splice(index, 1);
      renderSubjects();
    }

    function addSubject() {
      var input = document.getElementById('new-subject-input');
      var name = input.value.trim();
      if (name) {
        subjects.push(name);
        ratings.push(0);
        subjectIds.push(null);
        input.value = '';
        renderSubjects();
      }
    }

    // Event delegation on subjects list
    document.getElementById('subjects-list').addEventListener('click', function (e) {
      var starBtn = e.target.closest('.star-button');
      if (starBtn) {
        setRating(parseInt(starBtn.dataset.index), parseInt(starBtn.dataset.star));
        return;
      }
      var delBtn = e.target.closest('.btn-delete');
      if (delBtn) {
        removeSubject(parseInt(delBtn.dataset.index));
      }
    });

    document.getElementById('btn-add').addEventListener('click', addSubject);
    document.getElementById('new-subject-input').addEventListener('keyup', function (e) {
      if (e.key === 'Enter') addSubject();
    });

    document.getElementById('btn-events').addEventListener('click', function () {
      var notice = document.getElementById('save-notice');
      notice.textContent = 'Ratings saved successfully. Opening events...';
      notice.className = 'success-message';
    });

    document.getElementById('btn-back').addEventListener('click', function () {
      window.history.back();
    });

    // Initialize after a short delay to simulate async loading
    setTimeout(function () {
      subjects = window._mockSubjects.slice();
      ratings = new Array(subjects.length).fill(0);
      subjectIds = new Array(subjects.length).fill(null);

      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      renderSubjects();
    }, 100);
  </script>
</body>
</html>
